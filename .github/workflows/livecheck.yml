name: brew livecheck

on:
    workflow_dispatch:
    schedule:
        - cron: "45 */3 * * *"

env:
    HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
    livecheck:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Set up Homebrew
              id: set-up-homebrew
              uses: Homebrew/actions/setup-homebrew@main
              with:
                  token: ${{ secrets.GH_TOKEN }}

            - name: Cache Homebrew Bundler RubyGems
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: ${{ steps.set-up-homebrew.outputs.gems-path }}
                  key: ${{ runner.os }}-${{ runner.arch }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
                  restore-keys: ${{ runner.os }}-${{ runner.arch }}-rubygems-

            - name: Run livecheck
              run: bash .github/scripts/livecheck.sh

            - name: Configure Git user
              uses: Homebrew/actions/git-user-config@main
              with:
                  username: BrewTestBot

            - name: Bump outdated formulae
              id: bump
              run: bash .github/scripts/bump-formulae.sh
              env:
                  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
                  GH_TOKEN: ${{ secrets.GH_TOKEN }}

            - name: Send ntfy notification
              if: steps.bump.outputs.skipped != '' || steps.bump.outputs.failed != '' || steps.bump.outputs.bumped != ''
              env:
                  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
                  NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
                  NTFY_URL: ${{ secrets.NTFY_URL }}
              run: |
                  NOTIFICATION="🍺 Homebrew Livecheck Report\n\n"

                  if [[ -n "${{ steps.bump.outputs.skipped }}" ]]; then
                    NOTIFICATION="${NOTIFICATION}⏭️ Skipped (requires manual update):\n${{ steps.bump.outputs.skipped }}\n"
                  fi
                  if [[ -n "${{ steps.bump.outputs.bumped }}" ]]; then
                    NOTIFICATION="${NOTIFICATION}✅ Successfully bumped:\n${{ steps.bump.outputs.bumped }}\n"
                  fi
                  if [[ -n "${{ steps.bump.outputs.failed }}" ]]; then
                    NOTIFICATION="${NOTIFICATION}❌ Failed to bump:\n${{ steps.bump.outputs.failed }}"
                  fi

                  bash .github/scripts/ntfy.sh "Homebrew Formula Update Alert" "$NOTIFICATION"
              continue-on-error: true

            - name: Send ntfy notification on workflow failure
              if: failure()
              env:
                  NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
                  NTFY_AUTH: ${{ secrets.NTFY_AUTH }}
                  NTFY_URL: ${{ secrets.NTFY_URL }}
              run: |
                  bash .github/scripts/ntfy.sh \
                      "❌ Homebrew Livecheck Failed" \
                      "The livecheck workflow failed. Check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              continue-on-error: true
